[project]
name = "amesh-sim-4t-backend"
version = "0.6.0"
description = "Autel EVO Max 4T A-Mesh Swarm Simulator Backend with Configurable WGS84 Geodetic Origin"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
